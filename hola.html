<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer proyecto de IA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Mi primer proyecto de Inteligencia Artificial</h1>

    <p id="mensaje">
        Estoy aprendiendo a utilizar GitHub.
    </p>

    <button onclick="cambiarMensaje()">
        Pulsa aquí
    </button>

    <script>
        function cambiarMensaje() {
            document.getElementById("mensaje").textContent =
                "¡He conseguido modificar mi primera aplicación web!";
        }
    </script>

</body>
</html>
