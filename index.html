<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mi primer proyecto web para aprender GitHub y JavaScript.">
    <title>Mi primer proyecto de IA</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="tarjeta">
        <p class="etiqueta">Mi primer proyecto web</p>
        <h1>Aprendiendo con GitHub e IA</h1>
        <p id="mensaje" class="mensaje" aria-live="polite">
            Estoy aprendiendo a crear aplicaciones web sencillas.
        </p>
        <div class="acciones">
            <button id="boton-mensaje" type="button">Pulsa aquí</button>
            <button id="boton-tema" class="boton-secundario" type="button">Modo oscuro</button>
        </div>
    </main>

    <section class="aprendizaje" aria-labelledby="titulo-aprendizaje">
        <h2 id="titulo-aprendizaje">Lo que estoy aprendiendo</h2>
        <ul>
            <li>Organizar una web con HTML, CSS y JavaScript.</li>
            <li>Guardar versiones de mi proyecto con Git.</li>
            <li>Publicar mis cambios con GitHub Pages.</li>
        </ul>
    </section>
</body>
</html>
